<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test grand écran</title>
<link rel="stylesheet" href="design-navbar-footer.css">
<style>
  .container { max-width: 1200px; }
  .videos { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
  .videos iframe { width: 320px; height: 180px; border-radius: 8px; }
</style>
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="theme-techno.css">
</head>
<body class="no-main">
<main>
  <section class="cours">
    <h2>Chapitre I - test (2 cours)</h2>
    <div class="underline"></div>
    <div class="videos">
      <iframe width="560" height="315" src="https://www.youtube.com/embed/2e221w7HJyM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <video width="320" height="180" controls>
        <source src="MERISE.mp4" type="video/mp4">
      </video>
    </div>
  </section>
</main>
<script type="module" src="suivi-progression.js"></script>
<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    const rapport = [];
    const enveloppes = document.querySelectorAll(".progression-btn-wrap");
    rapport.push("enveloppes=" + enveloppes.length);
    enveloppes.forEach((env, i) => {
      const btn = env.querySelector(".video-fs-btn");
      const media = env.querySelector("iframe, video");
      rapport.push("env" + i + " btn=" + !!btn + " media=" + (media ? media.tagName : "AUCUN"));
    });

    // Simule le clic sur le bouton grand écran du premier cours.
    const btn = enveloppes[0] && enveloppes[0].querySelector(".video-fs-btn");
    if (btn) btn.click();

    setTimeout(() => {
      const env0 = enveloppes[0];
      rapport.push("apres-clic classe=" + (env0 ? env0.className : "n/a"));
      rapport.push("verrou=" + document.documentElement.className);
      rapport.push("aria=" + (btn ? btn.getAttribute("aria-label") : "n/a"));
      const r = env0 ? env0.getBoundingClientRect() : null;
      rapport.push("rect=" + (r ? Math.round(r.width) + "x" + Math.round(r.height) + " @0,0? " + (Math.round(r.left) === 0 && Math.round(r.top) === 0) : "n/a"));
      const m = env0 ? env0.querySelector("iframe, video") : null;
      const mr = m ? m.getBoundingClientRect() : null;
      rapport.push("media=" + (mr ? Math.round(mr.width) + "x" + Math.round(mr.height) : "n/a"));
      rapport.push("pos=" + (env0 ? getComputedStyle(env0).position : "n/a"));
      document.title = "RAPPORT " + rapport.join(" | ");
      console.log("RAPPORT " + rapport.join(" | "));
    }, 400);
  }, 600);
});
</script>
</body>
</html>
