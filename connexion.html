
<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | DigitalEduc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="theme-techno.css">
</head>
<body>
<div class="box">
  <h2><i class="fa-solid fa-right-to-bracket"></i> <span>Connexion</span></h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Adresse email" required autocomplete="email">
    <div class="champ-password">
      <input type="password" id="password" placeholder="Mot de passe" required autocomplete="current-password">
      <i class="fa-regular fa-eye bascule-password" title="Afficher / masquer le mot de passe"></i>
    </div>
    <p class="msg" id="errorMsg"></p>
    <button type="submit" id="submitBtn">Se connecter</button>
  </form>
  <a href="#" id="forgotLink"><i class="fa-solid fa-key"></i> <span>Mot de passe oublié ?</span></a>
  <a href="inscription.html"><span>Pas encore de compte ? S'inscrire</span></a>
</div>

<script type="module" src="firebase-config-1.js"></script>
<script type="module">
  // Oeil : afficher / masquer le mot de passe
  document.querySelectorAll('.bascule-password').forEach((icone) => {
    icone.addEventListener('click', () => {
      const champ = icone.parentElement.querySelector('input');
      const montre = champ.type === 'text';
      champ.type = montre ? 'password' : 'text';
      icone.classList.toggle('fa-eye', montre);
      icone.classList.toggle('fa-eye-slash', !montre);
    });
  });

  const errorMsg = document.getElementById('errorMsg');

  function afficherSucces(texte) {
    errorMsg.className = "msg msg-succes";
    errorMsg.textContent = texte;
  }

  function afficherErreur(texte) {
    errorMsg.className = "msg msg-erreur";
    errorMsg.textContent = texte;
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    errorMsg.className = "msg";
    errorMsg.textContent = "";

    try {
      await window.signInWithEmailAndPassword(email, password);
      window.location.href = "profil-1.html";
    } catch (err) {
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
        afficherErreur("Email ou mot de passe incorrect.");
      } else if (err.code === "auth/too-many-requests") {
        afficherErreur("Trop de tentatives. Réessayez plus tard.");
      } else {
        afficherErreur("Erreur : " + err.message);
      }
    }
  });

  const forgotLink = document.getElementById('forgotLink');
  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    // Réinitialisation du mot de passe par email : direction la page dédiée.
    window.location.href = "mot-de-passe-oublie.html";
  });
</script>
</body>
</html>
